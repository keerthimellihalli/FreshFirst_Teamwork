
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh First - Categories</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/categories.css">
</head>
<body>

    <header>
        <h1>Fresh First</h1>
        <h2>Product Category Management</h2>
    </header>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="stock.html">Stock</a>
        <a href="verification.html">Verification</a>
        <a href="priority.html">Priority</a>
        <a href="actions.html">Actions</a>
        <a href="history.html">History</a>
        <a href="reports.html">Reports</a>
        <a href="users.html">Users</a>
        <a href="categories.html">Categories</a>
    </nav>

    <main>
        <h2>Add Product Category</h2>

        <form id="categoryForm">

            <label for="categoryName">Category Name</label>
            <input type="text" id="categoryName"
                   placeholder="Enter category name" required>

            <label for="storageTemperature">
                Storage Temperature (°C)
            </label>
            <input type="number" id="storageTemperature"
                   step="0.1" placeholder="Enter temperature" required>

            <button type="submit">Add Category</button>

        </form>

        <h2>Category Details</h2>

        <table id="categoryTable">
            <thead>
                <tr>
                    <th>Category Name</th>
                    <th>Storage Temperature (°C)</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

    </main>

    <script src="js/categories.js"></script>

</body>
</html>
