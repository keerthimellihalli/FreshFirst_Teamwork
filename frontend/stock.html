
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh First - Stock Management</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/stock.css">
</head>
<body>

    <header>
        <h1>Fresh First</h1>
        <h2>Stock Management</h2>
    </header>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="stock.html">Stock</a>
        <a href="verification.html">Verification</a>
        <a href="priority.html">Priority</a>
        <a href="actions.html">Actions</a>
        <a href="history.html">History</a>
        <a href="reports.html">Reports</a>
    </nav>

    <main>
        <h2>Add New Product</h2>

        <form id="stockForm">

            <label for="productName">Product Name</label>
            <input type="text" id="productName" required>

            <label for="category">Category</label>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Fruits">Fruits</option>
                <option value="Vegetables">Vegetables</option>
                <option value="Dairy">Dairy Products</option>
                <option value="Other">Other</option>
            </select>

            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="1" required>

            <label for="expiryDate">Expiry Date</label>
            <input type="date" id="expiryDate" required>

            <label for="temperature">Storage Temperature (°C)</label>
            <input type="number" id="temperature" step="0.1">

            <button type="submit">Add Product</button>

        </form>

        <h2>Stock Details</h2>

        <table id="stockTable">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Expiry Date</th>
                    <th>Temperature</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

    </main>

    <script src="js/stock.js"></script>

</body>
</html>
