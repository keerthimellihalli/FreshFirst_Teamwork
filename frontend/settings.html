
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh First - Settings</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>

    <header>
        <h1>Fresh First</h1>
        <p>System Settings</p>
    </header>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="stock.html">Stock</a>
        <a href="verification.html">Verification</a>
        <a href="priority.html">Priority</a>
        <a href="actions.html">Actions</a>
        <a href="history.html">History</a>
        <a href="reports.html">Reports</a>
        <a href="users.html">Users</a>
        <a href="categories.html">Categories</a>
        <a href="settings.html">Settings</a>
    </nav>

    <main>
        <h2>Verification Settings</h2>

        <form id="settingsForm">

            <label for="expiryThreshold">Expiry Warning (Days)</label>
            <input type="number" id="expiryThreshold"
                   min="1" value="3" required>

            <label for="criticalThreshold">Critical Stock Quantity</label>
            <input type="number" id="criticalThreshold"
                   min="1" value="5" required>

            <label for="defaultTemperature">
                Default Storage Temperature (°C)
            </label>
            <input type="number" id="defaultTemperature"
                   step="0.1" required>

            <button type="submit">Save Settings</button>

        </form>
    </main>

    <script src="js/settings.js"></script>

</body>
</html>
