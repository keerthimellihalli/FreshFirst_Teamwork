
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh First - Stock Verification</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/verification.css">
</head>
<body>

    <header>
        <h1>Fresh First</h1>
        <h2>Stock Verification</h2>
    </header>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="stock.html">Stock</a>
        <a href="verification.html">Verification</a>
        <a href="priority.html">Priority</a>
        <a href="actions.html">Actions</a>
        <a href="history.html">History</a>
        <a href="reports.html">Reports</a>
    </nav>

    <main>
        <h2>Verify Product Details</h2>

        <form id="verificationForm">

            <label for="productName">Product Name</label>
            <input type="text" id="productName"
                   placeholder="Enter product name" required>

            <label for="quantity">Available Quantity</label>
            <input type="number" id="quantity"
                   placeholder="Enter quantity" min="0" required>

            <label for="expiryDate">Expiry Date</label>
            <input type="date" id="expiryDate" required>

            <label for="temperature">Storage Temperature (°C)</label>
            <input type="number" id="temperature"
                   step="0.1" placeholder="Enter temperature">

            <button type="submit">Verify Stock</button>

        </form>

        <section id="verificationResult">
            <h3>Verification Result</h3>
            <p id="resultMessage">
                Verification results will appear here.
            </p>
        </section>

    </main>

    <script src="js/verification.js"></script>

</body>
</html>
