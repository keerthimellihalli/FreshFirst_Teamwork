
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh First - Reports</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reports.css">
</head>
<body>

    <header>
        <h1>Fresh First</h1>
        <h2>Stock Reports</h2>
    </header>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="stock.html">Stock</a>
        <a href="verification.html">Verification</a>
        <a href="priority.html">Priority</a>
        <a href="actions.html">Actions</a>
        <a href="history.html">History</a>
        <a href="reports.html">Reports</a>
    </nav>

    <main>
        <h2>Generate Stock Report</h2>

        <section class="report-section">
            <h3>Report Details</h3>

            <label for="reportType">Select Report Type</label>
            <select id="reportType">
                <option value="">Select Report</option>
                <option value="Stock Report">Stock Report</option>
                <option value="Expiry Report">Expiry Report</option>
                <option value="Verification Report">Verification Report</option>
                <option value="Priority Report">Priority Report</option>
            </select>

            <label for="fromDate">From Date</label>
            <input type="date" id="fromDate">

            <label for="toDate">To Date</label>
            <input type="date" id="toDate">

            <button type="button" id="generateReport">
                Generate Report
            </button>

            <div id="reportResult">
                <p>Your report will appear here.</p>
            </div>
        </section>

    </main>

    <script src="js/reports.js"></script>

</body>
</html>
